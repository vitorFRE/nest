name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOKPLOY_APPLICATION_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOKPLOY_APPLICATION_ID != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: dokploy-production
      cancel-in-progress: false
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
    steps:
      - name: Trigger Dokploy deployment
        run: |
          : "${DOKPLOY_URL:?DOKPLOY_URL não configurada}"
          : "${DOKPLOY_API_KEY:?DOKPLOY_API_KEY não configurada}"
          curl --fail-with-body --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"
